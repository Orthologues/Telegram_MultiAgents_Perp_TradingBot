qwen_relation_task:
  description: >
    Classify the semantic relation of owner `{owner_id}`'s current normalized
    Telegram message against its chronological context and serial-RAG examples.
    Telegram context JSON: `{telegram_prompt_context_json}`
    Serial-RAG JSON: `{serial_rag_examples_json}`
    Return `duplicate`, `continuation`, `new_signal`, or `ambiguous`. Preserve the
    oldest-to-newest matched Telegram message IDs, use only the supplied
    context, tag `needs_human_labelling` for ambiguity or low confidence, and
    emit no order.
  expected_output: >
    A `TradingMessageRelationDecision` containing the source owner, channel,
    Telegram message ID, relation, chronological matched IDs, confidence,
    reason codes, and labelling flag.

qwen_strategy_task:
  description: >
    Analyze owner `{owner_id}`'s normalized Telegram message and chronological
    context. Context JSON: `{telegram_prompt_context_json}`
    Active cursor JSON: `{active_trade_cursors_json}`
    Serial-RAG JSON: `{serial_rag_examples_json}`
    Return one candidate for every strategy tier. Preserve the source
    deduplication key, leave omitted stop-losses unset, and emit no determined order.
  expected_output: >
    A `QwenStrategyCandidateSet` containing exactly `ultra_conservative`,
    `conservative`, `intermediate`, `radical`, and `ultra_radical` order candidates.

ministral_review_task:
  description: >
    Review all five QWEN strategy candidates against the same immutable source
    context. Telegram context JSON: `{telegram_prompt_context_json}`
    Active cursor JSON: `{active_trade_cursors_json}`
    Serial-RAG JSON: `{serial_rag_examples_json}`
    Validate structure and evidence, reject unresolved ambiguity or semantic
    duplicates, select exactly one most suitable approved candidate, and return
    one review for every tier plus `selected_strategy_tier`.
    Leave omitted stop-losses unset; the deterministic Flow policy may derive
    the selected candidate's stop-loss after selection. Do not call exchanges
    or bypass deterministic safety and execution gates.
  expected_output: >
    A `MinistralStrategyReviewSet` containing exactly one typed review for each
    of the five strategy tiers and a `selected_strategy_tier` identifying the
    approved candidate selected by Ministral.
