[project]
name = "agentic-perp-trading-bot-draft"
version = "0.1.0"
description = "Preliminary CrewAI app for an AG2 TelegramAgent-driven perpetual futures bot."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.28.0",
    "pydantic>=2.11.9,<2.13",
    "websockets>=12.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frameworkless_app", "src/crewai_app"]

[project.scripts]
crewai-trading-app = "crewai_app.main:run"

[tool.hatch.metadata]
allow-direct-references = true

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
telegram = [
    "ag2[bedrock,commsagent-telegram]>=0.13.2,<1",
]
exchange-upstreams = [
    "aster-mcp @ git+https://github.com/asterdex/aster-mcp.git@71fa3cf02401573f7450668c265c8f4b11c78db0",
    "mcp-hyperliquid @ git+https://github.com/Dakkshin/hyperliquid-mcp.git@812cbd155f0d2a714d2dbf3407d13096ce3a8c1d",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
crewai = [
    "crewai[tools]==1.15.17",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
