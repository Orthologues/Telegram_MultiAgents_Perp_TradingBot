[project]
name = "agentic-perp-trading-bot-draft"
version = "0.1.0"
description = "Draft scaffold for a Telegram-driven multi-agent perpetual futures trading bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
aws = [
    "boto3>=1.34",
]
mcp = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "websockets>=12.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
